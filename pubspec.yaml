
name: nova_fintech
description: Nova - Modern glassmorphic fintech banking demo.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Typography
  google_fonts: ^9.0.0

  # Animations
  flutter_animate: ^4.5.2

  # Carousel indicators
  smooth_page_indicator: ^3.0.0

  # Navigation
  go_router: ^18.1.2

  # State management
  flutter_riverpod: ^3.4.3

  # Currency and date formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
